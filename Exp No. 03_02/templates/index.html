<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medical Insurance Cost Prediction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            background: #f2f6fc;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }

        .container {

            width: 500px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0px 8px 25px
                rgba(0, 0, 0, 0.15);

        }

        h1 {

            text-align: center;

            color: #1565c0;

            margin-bottom: 8px;

        }

        h3 {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

            font-weight: normal;

        }

        label {

            display: block;

            font-weight: bold;

            margin-top: 14px;

            margin-bottom: 6px;

            color: #333;

        }

        input,
        select {

            width: 100%;

            padding: 11px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 7px;

            outline: none;

            background: white;

        }

        input:focus,
        select:focus {

            border-color: #1565c0;

        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            background: #1565c0;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;

        }

        button:hover {

            background: #0d47a1;

        }

        .result {

            margin-top: 25px;

            padding: 18px;

            background: #e8f5e9;

            color: #2e7d32;

            border-radius: 8px;

            text-align: center;

            font-size: 20px;

            font-weight: bold;

        }

        footer {

            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>Medical Insurance Cost Predictor</h1>

    <h3>Multiple Linear Regression</h3>


    <form action="/predict" method="POST">


        <label>
            Age
        </label>

        <input
            type="number"
            name="age"
            min="1"
            max="100"
            placeholder="Example: 35"
            required
        >


        <label>
            BMI
        </label>

        <input
            type="number"
            name="bmi"
            step="0.01"
            placeholder="Example: 27.5"
            required
        >


        <label>
            Number of Children
        </label>

        <input
            type="number"
            name="children"
            min="0"
            max="20"
            placeholder="Example: 2"
            required
        >


        <label>
            Sex
        </label>

        <select name="sex" required>

            <option value="">
                Select Sex
            </option>

            <option value="male">
                Male
            </option>

            <option value="female">
                Female
            </option>

        </select>


        <label>
            Smoker
        </label>

        <select name="smoker" required>

            <option value="">
                Select
            </option>

            <option value="yes">
                Yes
            </option>

            <option value="no">
                No
            </option>

        </select>


        <label>
            Region
        </label>

        <select name="region" required>

            <option value="">
                Select Region
            </option>

            <option value="northeast">
                Northeast
            </option>

            <option value="northwest">
                Northwest
            </option>

            <option value="southeast">
                Southeast
            </option>

            <option value="southwest">
                Southwest
            </option>

        </select>


        <button type="submit">

            Predict Insurance Cost

        </button>


    </form>


    {% if prediction_text %}

    <div class="result">

        {{ prediction_text }}

    </div>

    {% endif %}


    <footer>

        By Mr. Aditya Tanaji Gawade

    </footer>


</div>


</body>

</html>
