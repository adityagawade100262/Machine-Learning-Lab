<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sleep Requirement Prediction</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            background: #f2f6fc;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }


        .container {

            width: 500px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0px 8px 25px
                rgba(0, 0, 0, 0.15);

        }


        h1 {

            text-align: center;

            color: #1565c0;

            margin-bottom: 8px;

        }


        h3 {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

            font-weight: normal;

        }


        label {

            display: block;

            font-weight: bold;

            margin-top: 14px;

            margin-bottom: 6px;

            color: #333;

        }


        input {

            width: 100%;

            padding: 11px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 7px;

            outline: none;

        }


        input:focus {

            border-color: #1565c0;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            background: #1565c0;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;

        }


        button:hover {

            background: #0d47a1;

        }


        .result {

            margin-top: 25px;

            padding: 18px;

            background: #e8f5e9;

            color: #2e7d32;

            border-radius: 8px;

            text-align: center;

            font-size: 20px;

            font-weight: bold;

        }


        footer {

            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>Sleep Requirement Predictor</h1>

    <h3>Multiple Linear Regression</h3>


    <form action="/predict" method="POST">


        <label>
            Body Weight
        </label>

        <input
            type="number"
            name="body_weight"
            step="0.01"
            placeholder="Example: 100"
            required
        >


        <label>
            Brain Weight
        </label>

        <input
            type="number"
            name="brain_weight"
            step="0.01"
            placeholder="Example: 20"
            required
        >


        <label>
            Maximum Life Span
        </label>

        <input
            type="number"
            name="max_life_span"
            step="0.01"
            placeholder="Example: 15"
            required
        >


        <label>
            Gestation Time
        </label>

        <input
            type="number"
            name="gestation_time"
            step="0.01"
            placeholder="Example: 60"
            required
        >


        <label>
            Predation Index
        </label>

        <input
            type="number"
            name="predation_index"
            step="1"
            placeholder="Example: 3"
            required
        >


        <label>
            Sleep Exposure Index
        </label>

        <input
            type="number"
            name="sleep_exposure_index"
            step="1"
            placeholder="Example: 2"
            required
        >


        <label>
            Danger Index
        </label>

        <input
            type="number"
            name="danger_index"
            step="1"
            placeholder="Example: 3"
            required
        >


        <button type="submit">

            Predict Total Sleep

        </button>


    </form>


    {% if prediction_text %}

    <div class="result">

        {{ prediction_text }}

    </div>

    {% endif %}


    <footer>

        By Mr. Aditya Tanaji Gawade

    </footer>


</div>


</body>

</html>
