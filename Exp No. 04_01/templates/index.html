<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #e3f2fd,
                #fce4ec
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;

            color: #222;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            font-size: 14px;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        .unit {
            font-weight: normal;

            color: #777;

            font-size: 13px;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #007bff;

            box-shadow:
                0 0 5px rgba(0, 123, 255, 0.25);
        }

        input::placeholder {
            color: #aaa;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            background: #007bff;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 25px;

            padding: 15px;

            text-align: center;

            border-radius: 8px;

            background: #f1f8ff;

            color: #0056b3;

            font-size: 18px;

            font-weight: bold;
        }

        .info {
            margin-top: 20px;

            font-size: 12px;

            color: #777;

            text-align: center;

            line-height: 1.5;
        }

        @media (max-width: 500px) {

            .container {
                width: 90%;

                padding: 25px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>❤️ Heart Disease Prediction</h1>

    <p class="subtitle">
        Enter the patient's health information
    </p>


    <form action="/predict" method="POST">


        <!-- Age -->

        <div class="form-group">

            <label>
                Age
                <span class="unit">(years)</span>
            </label>

            <input
                type="number"
                name="age"
                placeholder="Example: 45"
                min="1"
                max="120"
                step="1"
                required
            >

        </div>


        <!-- Glucose -->

        <div class="form-group">

            <label>
                Blood Glucose
                <span class="unit">(mg/dL)</span>
            </label>

            <input
                type="number"
                name="glucose"
                placeholder="Example: 100"
                min="0"
                step="0.1"
                required
            >

        </div>


        <!-- Cholesterol -->

        <div class="form-group">

            <label>
                Cholesterol
                <span class="unit">(mg/dL)</span>
            </label>

            <input
                type="number"
                name="cholesterol"
                placeholder="Example: 200"
                min="0"
                step="0.1"
                required
            >

        </div>


        <!-- Systolic BP -->

        <div class="form-group">

            <label>
                Systolic Blood Pressure
                <span class="unit">(mmHg)</span>
            </label>

            <input
                type="number"
                name="systolic_bp"
                placeholder="Example: 120"
                min="50"
                max="250"
                step="1"
                required
            >

        </div>


        <!-- BMI -->

        <div class="form-group">

            <label>
                Body Mass Index
                <span class="unit">(BMI)</span>
            </label>

            <input
                type="number"
                name="bmi"
                placeholder="Example: 24.5"
                min="5"
                max="80"
                step="0.1"
                required
            >

        </div>


        <!-- Button -->

        <button type="submit">
            🔍 Predict Disease
        </button>

    </form>


    <!-- Prediction -->

    {% if prediction %}

        <div class="result">
            {{ prediction }}
        </div>

    {% endif %}


    <div class="info">

        

    </div>

</div>

</body>

</html>
